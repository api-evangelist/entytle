aid: entytle
name: Entytle
description: 'Entytle, Inc. (founded 2014, Austin, Texas) provides an Installed Base
  Intelligence SaaS platform for equipment manufacturers (OEMs). It unifies fragmented
  data from ERP, CRM, FSM systems, and spreadsheets into a single "Source of Truth"
  for an OEM''s installed base, then applies purpose-built AI and a Data Quality Engine
  to surface aftermarket revenue opportunities, predict parts/service/upgrade needs,
  and prevent customer churn. Products include Aftermarket IQ (IB 360, Customer Central,
  Customer Loyalty Manager, Predictive Opportunities, Wallet Share Assessment), an
  AI Quote Agent, Asset Lifecycle Management, IB HealthCheck, and a Data Quality Engine.
  Customers include Johnson Controls, Baker Hughes, Xylem, GEA, Dematic, Duravant,
  and Peerless Pump. Surfaced as an Accel portfolio company and enriched from Entytle''s
  public surface; Entytle exposes an enterprise application (Entytle Insyghts) but
  publishes no public developer API, OpenAPI, or SDK.'
